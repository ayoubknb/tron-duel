<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tron Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
  :root {
    --bg: #05070d; --panel: #0b1020; --line: #16203a; --text: #d7e2ff; --dim: #6a7aa3;
    --accent: #36f2ff; --err: #ff3b4a;
    --font: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
    overflow: hidden; touch-action: none; user-select: none;
  }
  header { width: 100%; max-width: 960px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 1.1rem; letter-spacing: .3em; font-weight: 700; white-space: nowrap; }
  #board { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; min-width: 0; }
  .pl { color: var(--c); text-align: center; font-variant-numeric: tabular-nums; }
  .pl b { display: block; font-size: 1.5rem; line-height: 1.1; text-shadow: 0 0 12px var(--c); }
  .pl span { display: block; font-size: .65rem; letter-spacing: .1em; max-width: 8em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl.out { opacity: .35; }
  #fx { width: 100%; max-width: 960px; min-height: 24px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { position: relative; overflow: hidden; border: 1px solid var(--c); color: var(--c); font-size: .75rem; font-weight: 700; letter-spacing: .12em; padding: 3px 10px 5px; }
  .chip i { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--c); animation: drain linear forwards; }
  @keyframes drain { to { width: 0; } }
  #wrap { position: relative; flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  canvas { display: block; border: 1px solid var(--line); box-shadow: 0 0 40px #0a1a3a; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; pointer-events: none; padding: 8px; overflow-y: auto;
  }
  #big { font-size: clamp(1.8rem, 8vw, 4.5rem); font-weight: 700; letter-spacing: .08em; }
  #sub { color: var(--dim); font-size: 1rem; max-width: 40ch; }
  button { font: inherit; font-weight: 700; background: var(--accent); color: #001018; border: 0; padding: 6px 12px; cursor: pointer; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  #mute { background: transparent; color: var(--dim); border: 1px solid var(--line); font-size: .8rem; letter-spacing: .1em; white-space: nowrap; }
  #mute.on { color: var(--accent); border-color: var(--accent); }

  .panel { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 12px; width: min(360px, 100%); text-align: left; }
  .lbl, .panel label { font-size: .7rem; letter-spacing: .18em; color: var(--dim); }
  #plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #plist li { display: flex; align-items: center; gap: 10px; font-size: 1rem; }
  #plist li i { width: 14px; height: 14px; flex: none; background: var(--c); box-shadow: 0 0 8px var(--c); }
  #plist li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #plist li em { margin-left: auto; font-style: normal; font-size: .65rem; letter-spacing: .15em; color: var(--dim); }
  #plist li.empty { color: var(--dim); font-size: .85rem; }
  form, #hostBox { display: flex; flex-direction: column; gap: 10px; }
  #name { font: inherit; font-size: 1.1rem; background: var(--bg); color: var(--text); border: 1px solid var(--line); padding: 8px 10px; width: 100%; user-select: text; }
  #swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .sw { aspect-ratio: 1; padding: 0; border: 2px solid transparent; background: var(--sw); box-shadow: 0 0 10px var(--sw); }
  .sw.sel { border-color: var(--text); outline: 2px solid var(--sw); outline-offset: 2px; }
  .sw:disabled { opacity: .15; box-shadow: none; }
  .big-btn { font-size: 1.05rem; letter-spacing: .2em; padding: 10px; }
  #play { background: var(--pick, var(--accent)); }
  #lobbyErr { margin: 0; color: var(--err); font-size: .85rem; }
  .share { display: flex; gap: 8px; align-items: center; background: var(--bg); border: 1px solid var(--line); padding: 6px 8px; }
  .share code { font-size: .78rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  #waitHost { margin: 0; color: var(--dim); font-size: .9rem; }
  #home { align-items: stretch; }
  @media (max-width: 560px) {
    h1 { display: none; }
    #mute { font-size: .7rem; padding: 6px 8px; }
    .pl b { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<header>
  <h1>TRON DUEL</h1>
  <div id="board"></div>
  <button id="mute" type="button">MUSIQUE</button>
</header>
<div id="fx"></div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="overlay">
    <div id="big">CONNEXION…</div>
    <div id="sub"></div>
    <div class="panel" id="home" hidden>
      <button id="create" class="big-btn" type="button">CRÉER UN LOBBY</button>
    </div>
    <div class="panel" id="panel" hidden>
      <ul id="plist"></ul>
      <form id="joinForm">
        <label for="name">PSEUDO</label>
        <input id="name" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Ton pseudo">
        <span class="lbl">COULEUR</span>
        <div id="swatches"></div>
        <p id="lobbyErr" hidden></p>
        <button id="play" class="big-btn" type="submit">REJOINDRE</button>
      </form>
      <div id="hostBox">
        <div class="share"><code id="link"></code><button id="copy" type="button">Copier</button></div>
        <button id="start" class="big-btn" type="button">LANCER</button>
        <p id="waitHost"></p>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const room = new URLSearchParams(location.search).get('r');
const ITEM_COL = { turbo: '#ffe14a', frein: '#ff3b4a', fantome: '#c9b8ff', gomme: '#3dff7a', mur: '#6fa0ff' };
const cv = $('cv'), cx = cv.getContext('2d');

let W = 60, H = 40, cell = 10, MAXP = 5, COLORS = [];
let myId = null, lob = { players: [], host: null, phase: 'lobby', match: [] };
let ids = [], info = [], scores = [], alive = [], trails = [], crashes = [];
let walls = new Uint8Array(W * H), items = [];
let myColor = store.get('tronColor'), wasJoined = false;
$('name').value = store.get('tronName') || '';

const myIdx = () => (lob.phase === 'game' ? (ids.length ? ids : lob.match).indexOf(myId) : -1);
const meJoined = () => lob.players.some(p => p.id === myId);
const pById = id => lob.players.find(p => p.id === id);

// ---------- Rendu ----------
function fit() {
  const wrap = $('wrap').getBoundingClientRect();
  cell = Math.max(4, Math.floor(Math.min(wrap.width / W, wrap.height / H)));
  cv.width = W * cell; cv.height = H * cell;
  redraw();
}
function redraw() {
  cx.fillStyle = '#05070d'; cx.fillRect(0, 0, cv.width, cv.height);
  cx.strokeStyle = '#0d1528'; cx.lineWidth = 1;
  for (let x = 0; x <= W; x += 5) { cx.beginPath(); cx.moveTo(x * cell + .5, 0); cx.lineTo(x * cell + .5, cv.height); cx.stroke(); }
  for (let y = 0; y <= H; y += 5) { cx.beginPath(); cx.moveTo(0, y * cell + .5); cx.lineTo(cv.width, y * cell + .5); cx.stroke(); }
  for (let i = 0; i < walls.length; i++) if (walls[i]) {
    const x = i % W, y = (i / W) | 0;
    cx.fillStyle = '#1a2850'; cx.fillRect(x * cell, y * cell, cell, cell);
    cx.fillStyle = '#2a4180'; cx.fillRect(x * cell + 2, y * cell + 2, cell - 4, cell - 4);
  }
  items.forEach(drawItem);
  trails.forEach((t, i) => t.forEach((p, j) => drawCell(i, p, j === t.length - 1 && alive[i])));
  crashes.forEach(drawBoom);
}
function drawItem([x, y, k]) {
  const mx = (x + 1) * cell, my = (y + 1) * cell, r = cell * 0.85, c = ITEM_COL[k];
  cx.save();
  cx.shadowColor = c; cx.shadowBlur = 12;
  cx.fillStyle = c; cx.strokeStyle = c; cx.lineWidth = Math.max(2, cell / 5); cx.lineJoin = 'round';
  if (k === 'turbo') {
    for (const off of [-r * 0.45, r * 0.25]) {
      cx.beginPath(); cx.moveTo(mx + off - r * 0.3, my - r * 0.6); cx.lineTo(mx + off + r * 0.3, my); cx.lineTo(mx + off - r * 0.3, my + r * 0.6); cx.stroke();
    }
  } else if (k === 'frein') {
    cx.beginPath(); cx.arc(mx, my, r * 0.8, 0, 7); cx.fill();
    cx.shadowBlur = 0; cx.fillStyle = '#fff'; cx.fillRect(mx - r * 0.5, my - r * 0.14, r, r * 0.28);
  } else if (k === 'fantome') {
    cx.beginPath(); cx.arc(mx, my, r * 0.7, 0, 7); cx.stroke();
  } else if (k === 'mur') {
    const bw = r * 0.62, bh = r * 0.42, g = r * 0.1;
    cx.fillRect(mx - bw - g / 2, my - bh - g / 2, bw, bh); cx.fillRect(mx + g / 2, my - bh - g / 2, bw, bh);
    cx.fillRect(mx - bw / 2, my + g / 2, bw, bh);
  } else {
    cx.beginPath(); cx.moveTo(mx, my - r * 0.85); cx.lineTo(mx + r * 0.7, my); cx.lineTo(mx, my + r * 0.85); cx.lineTo(mx - r * 0.7, my); cx.closePath(); cx.fill();
  }
  cx.restore();
}
function drawCell(i, [x, y], head) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  cx.fillStyle = info[i] ? info[i].color : '#888';
  cx.globalAlpha = head ? 1 : .75;
  cx.fillRect(x * cell, y * cell, cell, cell);
  if (head) { cx.fillStyle = '#fff'; const m = cell / 3; cx.fillRect(x * cell + m, y * cell + m, cell - 2 * m, cell - 2 * m); }
  cx.globalAlpha = 1;
}
function drawBoom([x, y]) {
  x = Math.max(0, Math.min(W - 1, x)); y = Math.max(0, Math.min(H - 1, y));
  cx.strokeStyle = '#fff'; cx.lineWidth = 2;
  cx.beginPath(); cx.arc((x + .5) * cell, (y + .5) * cell, cell * 1.6, 0, 7); cx.stroke();
}

// ---------- Interface ----------
function renderBoard() {
  const box = $('board'); box.textContent = '';
  const rows = lob.phase === 'game' && ids.length
    ? ids.map((id, i) => ({ id, name: info[i].name, color: info[i].color, score: scores[i], out: !alive[i] }))
    : lob.players.map(p => ({ ...p, out: false }));
  rows.forEach(p => {
    const d = document.createElement('div');
    d.className = 'pl' + (p.out ? ' out' : ''); d.style.setProperty('--c', p.color);
    const b = document.createElement('b'); b.textContent = p.score || 0;
    const s = document.createElement('span'); s.textContent = p.name + (p.id === myId ? ' (toi)' : '');
    d.append(b, s); box.appendChild(d);
  });
}
function msg(big, sub = '', color = 'var(--text)') {
  $('panel').hidden = true; $('home').hidden = true;
  $('big').textContent = big; $('big').style.color = color; $('sub').textContent = sub;
}
function showHome() {
  msg('TRON DUEL', '2 à 5 joueurs');
  $('home').hidden = false;
}
function showLobby() {
  const n = lob.players.length, joinedNow = meJoined(), inGame = lob.phase === 'game';
  $('big').textContent = 'LOBBY'; $('big').style.color = 'var(--text)';
  $('sub').textContent = inGame ? 'Partie en cours · tu joues à la prochaine' : `${n}/${MAXP} pilotes`;
  $('home').hidden = true; $('panel').hidden = false;

  const ul = $('plist'); ul.textContent = '';
  if (!n) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'Personne pour l’instant.'; ul.appendChild(li); }
  lob.players.forEach(p => {
    const li = document.createElement('li'); li.style.setProperty('--c', p.color);
    const i = document.createElement('i');
    const s = document.createElement('span'); s.textContent = p.name + (p.id === myId ? ' (toi)' : '');
    li.append(i, s);
    if (p.id === lob.host) { const e = document.createElement('em'); e.textContent = 'HÔTE'; li.appendChild(e); }
    ul.appendChild(li);
  });

  $('joinForm').hidden = joinedNow || n >= MAXP;
  if (!joinedNow && n >= MAXP) { $('sub').textContent = 'Lobby plein, tu regardes.'; }
  if (!$('joinForm').hidden) renderSwatches();

  $('hostBox').hidden = !joinedNow;
  const isHost = lob.host === myId;
  $('start').hidden = !isHost || inGame;
  $('start').disabled = n < 2;
  $('start').textContent = n < 2 ? 'LANCER (2 MIN.)' : `LANCER · ${n} JOUEURS`;
  const host = pById(lob.host);
  $('waitHost').hidden = isHost || inGame;
  $('waitHost').textContent = host ? `En attente que ${host.name} lance.` : '';
}
function refreshIdle() {
  if (!room) return showHome();
  if (lob.phase === 'lobby') return showLobby();
  if (myIdx() < 0) {
    if (!meJoined()) showLobby();
    else msg('', 'Partie en cours · tu joues à la prochaine');
  }
}
function takenColors() { return lob.players.filter(p => p.id !== myId).map(p => p.color); }
function renderSwatches() {
  const box = $('swatches'); box.textContent = '';
  const taken = takenColors();
  if (!myColor || taken.includes(myColor) || !COLORS.includes(myColor)) myColor = COLORS.find(c => !taken.includes(c));
  COLORS.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw' + (c === myColor ? ' sel' : '');
    b.style.setProperty('--sw', c); b.setAttribute('aria-label', 'Couleur ' + c);
    b.disabled = taken.includes(c);
    b.onclick = () => { myColor = c; $('lobbyErr').hidden = true; renderSwatches(); };
    box.appendChild(b);
  });
  $('play').style.setProperty('--pick', myColor);
}
function lobbyError(t) { $('lobbyErr').textContent = t; $('lobbyErr').hidden = false; }
$('name').addEventListener('input', () => { $('lobbyErr').hidden = true; });
$('joinForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('name').value.trim().slice(0, 12);
  if (!name) { lobbyError('Mets un pseudo.'); $('name').focus(); return; }
  store.set('tronName', name); store.set('tronColor', myColor);
  sendJoin();
});
function sendJoin() {
  if (window.ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'join', name: $('name').value.trim(), color: myColor }));
}
$('start').onclick = () => { if (window.ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'start' })); };
$('create').onclick = () => { location.href = location.pathname + '?r=' + Math.random().toString(36).slice(2, 7); };
if (room) {
  const shareUrl = location.origin + location.pathname + '?r=' + encodeURIComponent(room);
  $('link').textContent = shareUrl;
  $('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(shareUrl); $('copy').textContent = 'Copié'; }
    catch { getSelection().selectAllChildren($('link')); }
  };
}

function addFx(p, label, ms) {
  if (!info[p]) return;
  const chip = document.createElement('span');
  chip.className = 'chip'; chip.style.setProperty('--c', info[p].color);
  chip.textContent = label + ' · ' + info[p].name;
  const bar = document.createElement('i'); bar.style.animationDuration = ms + 'ms';
  chip.appendChild(bar); $('fx').appendChild(chip);
  setTimeout(() => chip.remove(), ms);
}

// ---------- Sons ----------
let audio = null;
function unlockAudio() {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    startMusic();
  } catch {}
}
['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, unlockAudio, { passive: true }));
const audioOk = () => audio && audio.state === 'running';
function tone(f1, f2, t, dur, type, vol) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function joinSound() {
  if (!audioOk()) return;
  const t = audio.currentTime;
  [[660, 0], [990, .12], [1320, .24]].forEach(([f, dt]) => tone(f, f, t + dt, 0.18, 'square', 0.15));
}
function pickSound(k) {
  if (!audioOk()) return;
  const t = audio.currentTime;
  if (k === 'turbo') tone(250, 1400, t, 0.3, 'sawtooth', 0.12);
  else if (k === 'frein') tone(700, 90, t, 0.4, 'square', 0.1);
  else if (k === 'mur') { tone(110, 520, t, 0.35, 'square', 0.1); tone(165, 780, t + 0.05, 0.3, 'square', 0.06); }
  else if (k === 'fantome') { tone(880, 440, t, 0.25, 'sine', 0.2); tone(440, 880, t + 0.2, 0.3, 'sine', 0.15); }
  else {
    const len = audio.sampleRate * 0.4, buf = audio.createBuffer(1, len, audio.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(5000, t + 0.4);
    g.gain.value = 0.35; src.connect(f).connect(g).connect(audio.destination); src.start(t);
  }
}

// Musique spatiale générée en direct (aucun fichier audio)
let music = null, musicOn = store.get('tronMusic') !== '0';
const MUSIC_VOL = 0.45;
function updMute() { $('mute').classList.toggle('on', musicOn); $('mute').textContent = musicOn ? 'MUSIQUE ON' : 'MUSIQUE OFF'; }
updMute();
$('mute').onclick = () => {
  musicOn = !musicOn; updMute();
  store.set('tronMusic', musicOn ? '1' : '0');
  if (music) music.master.gain.setTargetAtTime(musicOn ? MUSIC_VOL : 0, audio.currentTime, 0.1);
};
function startMusic() {
  if (music || !audio) return;
  const A = audio, mtof = n => 440 * Math.pow(2, (n - 69) / 12);
  const master = A.createGain(); master.gain.value = musicOn ? MUSIC_VOL : 0; master.connect(A.destination);
  const delay = A.createDelay(1); delay.delayTime.value = 0.43;
  const fb = A.createGain(); fb.gain.value = 0.4; delay.connect(fb).connect(delay); delay.connect(master);
  const lp = A.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 3; lp.connect(master);
  const lfo = A.createOscillator(), lfoG = A.createGain();
  lfo.frequency.value = 0.06; lfoG.gain.value = 450; lfo.connect(lfoG).connect(lp.frequency); lfo.start();

  const CHORDS = [[45, 57, 60, 64], [41, 53, 57, 60], [48, 55, 60, 67], [43, 55, 59, 62]];
  const ARP = [0, 1, 2, 3, 2, 1, 3, 2];
  const step = 60 / 104 / 2;
  let next = A.currentTime + 0.1, i = 0;

  function pad(chord, t, dur) {
    chord.forEach(n => [-7, 7].forEach(det => {
      const o = A.createOscillator(), g = A.createGain();
      o.type = 'sawtooth'; o.frequency.value = mtof(n); o.detune.value = det;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.025, t + 1.2);
      g.gain.setValueAtTime(0.025, t + dur - 0.8);
      g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.4);
      o.connect(g).connect(lp); o.start(t); o.stop(t + dur + 0.5);
    }));
  }
  function pluck(n, t, vol) {
    const o = A.createOscillator(), g = A.createGain();
    o.type = 'triangle'; o.frequency.value = mtof(n);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(g); g.connect(master); g.connect(delay);
    o.start(t); o.stop(t + 0.45);
  }
  function schedule() {
    while (next < A.currentTime + 0.3) {
      const chord = CHORDS[Math.floor(i / 16) % 4];
      if (i % 16 === 0) pad(chord, next, 16 * step);
      pluck(chord[ARP[i % 8]] + 12, next, i % 4 === 0 ? 0.08 : 0.05);
      if (i % 8 === 0) pluck(chord[0], next, 0.12);
      next += step; i++;
    }
  }
  music = { master, timer: setInterval(schedule, 100) };
  schedule();
}

// ---------- Réseau ----------
let countTimer;
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/?r=' + encodeURIComponent(room));
  window.ws = ws;
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'hello') {
      myId = m.you; W = m.W; H = m.H; COLORS = m.colors; MAXP = m.max; walls = new Uint8Array(W * H); fit();
      if (wasJoined) sendJoin();
    } else if (m.t === 'lobby') {
      const before = lob.players.length;
      lob = m;
      if (meJoined()) wasJoined = true;
      if (meJoined() && lob.players.length > before && before > 0) joinSound();
      if (lob.phase === 'lobby') { ids = []; $('fx').textContent = ''; }
      renderBoard();
      refreshIdle();
    } else if (m.t === 'taken') {
      showLobby(); lobbyError("Cette couleur vient d'être prise, choisis-en une autre.");
    } else if (m.t === 'full') {
      showLobby(); lobbyError('Lobby plein.');
    } else if (m.t === 'round') {
      W = m.W; H = m.H; ids = m.ids; scores = m.scores; alive = m.alive;
      info = ids.map(id => { const p = pById(id); return p ? { name: p.name, color: p.color } : { name: '?', color: '#888' }; });
      walls = new Uint8Array(W * H); m.walls.forEach(i => { walls[i] = 1; });
      items = m.items || []; crashes = []; $('fx').textContent = '';
      trails = ids.map(() => []);
      if (m.cells) m.cells.forEach(([i, v]) => trails[v - 1].push([i % W, (i / W) | 0]));
      m.heads.forEach((h, i) => trails[i].push(h));
      fit(); renderBoard();
      clearInterval(countTimer);
      if (m.live || (!meJoined() && myIdx() < 0)) { refreshIdle(); return; }
      const col = myIdx() >= 0 ? info[myIdx()].color : 'var(--text)';
      let n = 3;
      msg(String(n), m.map, col);
      countTimer = setInterval(() => { n--; if (n > 0) msg(String(n), m.map, col); else clearInterval(countTimer); }, 1000);
    } else if (m.t === 'go') {
      clearInterval(countTimer);
      if (myIdx() >= 0) msg(''); else refreshIdle();
    } else if (m.t === 'tick') {
      m.h.forEach((p, i) => {
        if (!alive[i]) return;
        const t = trails[i], prev = t[t.length - 1];
        if (prev && prev[0] === p[0] && prev[1] === p[1]) return;
        if (prev) drawCell(i, prev, false);
        t.push(p); drawCell(i, p, true);
      });
    } else if (m.t === 'crash') {
      m.p.forEach(i => { alive[i] = false; const t = trails[i]; if (t && t.length) crashes.push(t[t.length - 1]); });
      redraw(); renderBoard();
      if (m.p.includes(myIdx()) && alive.filter(Boolean).length > 1) msg('CRASH', 'Tu regardes la fin de la manche', 'var(--dim)');
    } else if (m.t === 'items') {
      items = m.items; redraw();
    } else if (m.t === 'pick') {
      items = m.items;
      pickSound(m.k);
      if (m.k === 'turbo') addFx(m.p, 'TURBO', 3000);
      else if (m.k === 'frein') alive.forEach((a, i) => { if (a && i !== m.p) addFx(i, 'FREIN', 3000); });
      else if (m.k === 'fantome') addFx(m.p, 'FANTÔME', 2000);
      else if (m.k === 'mur') addFx(m.p, 'PASSE-MURAILLE', 3000);
      else { addFx(m.p, 'GOMME', 1200); trails = m.heads.map(h => [h]); }
      redraw();
    } else if (m.t === 'end') {
      scores = m.scores; renderBoard();
      if (!meJoined()) return;
      const me = myIdx(), w = m.winner;
      let big, color;
      if (w < 0) { big = 'ÉGALITÉ'; color = 'var(--text)'; }
      else if (w === me) { big = m.match ? 'VICTOIRE' : 'MANCHE GAGNÉE'; color = info[me].color; }
      else { big = info[w].name.toUpperCase() + (m.match ? ' GAGNE LE MATCH' : ' MARQUE'); color = info[w].color; }
      msg(big, m.match ? 'Retour au lobby…' : 'Manche suivante…', color);
    }
  };
  ws.onclose = () => { msg('DÉCONNECTÉ', 'Reconnexion…'); setTimeout(connect, 1500); };
}

// ---------- Contrôles ----------
function turn(d) { if (window.ws && ws.readyState === 1 && myIdx() >= 0) ws.send(JSON.stringify({ t: 'dir', d })); }
const KEYS = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, z: 0, w: 0, d: 1, s: 2, q: 3, a: 3 };
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const d = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (d !== undefined) { e.preventDefault(); turn(d); }
});
let t0 = null;
addEventListener('touchstart', e => { const t = e.touches[0]; t0 = [t.clientX, t.clientY]; }, { passive: true });
addEventListener('touchmove', e => {
  if (!t0) return;
  const t = e.touches[0], dx = t.clientX - t0[0], dy = t.clientY - t0[1];
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  t0 = [t.clientX, t.clientY];
}, { passive: true });
addEventListener('resize', fit);

fit();
if (room) connect(); else showHome();
</script>
